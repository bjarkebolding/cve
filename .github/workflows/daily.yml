# daily rebuild of data + deploy to GitHub Pages
name: daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python3 test_build.py
          python3 test_sources.py
      - name: Build CVE core data (cvelistV5)
        env:
          CVE_CLONE_DIR: ${{ runner.temp }}/cvelistV5
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 build.py
          python3 build.py   # second run exercises the incremental path
      - name: Fetch auxiliary sources (KEV, OSV, npm/pypistats, NVD CVSS join)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}  # optional; 10x faster NVD
        run: python3 sources.py
      - name: Sanity check
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open("data/data.json"))
          assert d["total"] > 300000, d["total"]
          assert d["aiTotal"] > 100, d["aiTotal"]
          assert len(d["months"]) > 300
          sv = json.load(open("data/severity.json"))
          assert sv["aiTotal"] > 100 and len(sv["months"]) > 10, (sv["aiTotal"], len(sv["months"]))
          print(f"ok: {d['total']} total, {d['aiTotal']} AI, {sv['rated']} rated")
          EOF
      - name: Commit data
        run: |
          git config user.name "cve-dashboard[bot]"
          git config user.email "cve-dashboard@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "daily data refresh ($(date -u +%F))"
            git push
          else
            echo "data unchanged"
          fi
      - name: Assemble static site
        id: assemble
        run: |
          mkdir -p dist/vendor
          cp index.html logo.svg dist/
          cp -r css js data dist/
          rm -f dist/data/cache.json dist/data/last_head.txt
          cp vendor/uPlot.iife.min.js vendor/uPlot.min.css dist/vendor/
          du -sh dist
      # Deploy on every trigger: the data commit above is pushed with
      # GITHUB_TOKEN, which does not start a new workflow run, so cron runs
      # must deploy themselves or the refreshed data never goes live.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
